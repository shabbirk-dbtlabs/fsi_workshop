name: 'fsi_workshop'
version: '1.0.0'
config-version: 2
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

dbt-cloud:
    project-id: 21286

models:
  fsi_workshop:
    +static_analysis: strict
    +state:
      lag_tolerance: 24h
      require_fresh_data_from: any
    bronze:
      +materialized: view
      +tags: [bronze, fdic]
    silver:
      +tags: [silver, fdic]
      +state:
        lag_tolerance: 7d
    gold:
      +materialized: table
      +tags: [gold, fdic]
      +state:
        lag_tolerance: 7d
    workshop_incident:
      +enabled: "{{ var('enable_workshop_incident', false) }}"
      +tags: [workshop_incident, intentional_failure]
