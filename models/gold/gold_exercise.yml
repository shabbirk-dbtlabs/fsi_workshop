version: 2

models:
  - name: mart_fdic_institution_deposit_health_exercise
    description: Gold mart used in the workshop exercise for institution-year deposit health.
    columns:
      - name: institution_annual_financial_key
        description: Intended institution-year key.
        data_tests: [unique, not_null]
      - name: total_deposits_usd
        description: Institution total deposits in USD.
        data_tests:
          - not_null
          - equals_healthy_financials:
              arguments:
                compare_model: ref('fct_fdic_institution_annual_financials')
                column_name: total_deposits_usd


      - name: deposit_to_asset_ratio
        description: Deposits divided by assets.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5
      - name: non_domestic_deposits_usd
        description: Nonnegative total deposits less domestic deposits.
        data_tests:
          - dbt_utils.expression_is_true:
             arguments:
              expression: ">= 0"
              
  - name: mart_fdic_deposit_portfolio_exercise
    description: Gold annual portfolio rollup used in the workshop exercise.
    columns:
      - name: observation_date
        description: Annual reporting date.
        data_tests: [unique, not_null]
      - name: portfolio_deposit_to_asset_ratio
        description: Portfolio total deposits divided by portfolio assets.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5
